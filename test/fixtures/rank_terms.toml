name = "rank_terms"

[provenance]
r_version = "4.6.1"
ergm_rank_version = "4.1.2"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260912
script = "test/fixtures/r/rank_terms.R"
date = "2026-09-12"
dataset = "the 4-actor ERGMRank.jl test network (README/docstrings) and a seeded random 8-actor complete ranking; GREATER value = HIGHER standing"
model = "summary(nw ~ rank.deference + rank.nonconformity(\"all\") + rank.nonconformity(\"localAND\") + rank.nodeicov(\"x\") + rank.inconsistency(ref) + rank.edgecov(cov), response=\"rank\")"
what = "summary statistics only: deterministic functions of the ranking and the covariates"

[tolerance]
# Every value is a deterministic function of a frozen ranking and frozen
# integer covariates: the counting terms are integers and the covariate
# terms are sums of integer differences, so both sides are exact in
# Float64. 1e-9 is machine precision with headroom; a disagreement is a
# bug in a term formula, full stop.
default = 1e-9

[values]
# One name per statistic, in the order of the vectors below (ergm.rank's
# summary() names).
statistic_names = ["deference", "nonconformity", "nonconformity.localAND", "nodeicov.rank.x", "inconsistency.rank", "edgecov.rank.cov"]

# --- the 4-actor network: ranks (row = ego), covariate, reference, cov -----
n4 = 4
ranks4 = [[0, 3, 2, 1], [3, 0, 1, 2], [1, 3, 0, 2], [2, 1, 3, 0]]
x4 = [10, 20, 30, 40]
ref4 = [[0, 1, 2, 3], [3, 0, 1, 2], [1, 3, 0, 2], [2, 1, 3, 0]]
cov4 = [[10, 20, 30, 40], [10, 20, 30, 40], [10, 20, 30, 40], [10, 20, 30, 40]]
stats4 = [6, 10, 4, -40, 6, -40]

# --- the seeded 8-actor ranking ---------------------------------------------
n8 = 8
ranks8 = [[0, 5, 6, 7, 1, 3, 2, 4], [4, 0, 3, 2, 5, 7, 1, 6], [1, 6, 0, 2, 4, 5, 7, 3], [1, 6, 5, 0, 7, 3, 2, 4], [7, 2, 5, 4, 0, 6, 3, 1], [2, 1, 3, 4, 6, 0, 7, 5], [7, 6, 2, 4, 5, 1, 0, 3], [2, 6, 3, 5, 7, 4, 1, 0]]
x8 = [-4, -4, -1, 3, -2, 4, 1, -2]
ref8 = [[0, 7, 3, 2, 1, 4, 5, 6], [3, 0, 5, 2, 7, 6, 1, 4], [6, 3, 0, 7, 5, 4, 1, 2], [6, 1, 4, 0, 5, 3, 7, 2], [3, 6, 7, 5, 0, 2, 4, 1], [4, 2, 1, 5, 7, 0, 6, 3], [7, 2, 3, 6, 1, 5, 0, 4], [1, 4, 6, 3, 5, 7, 2, 0]]
cov8 = [[3, 1, 0, 3, -1, -1, -3, -2], [1, -2, -1, 0, 2, 2, 0, -3], [3, 3, -3, -1, -3, 0, 1, -1], [2, 2, 1, -3, 0, -3, 3, 2], [-1, 0, -1, -3, -2, -1, 3, 3], [2, -1, 2, 2, 3, -2, -3, -1], [-2, -1, 2, 0, 0, 0, 1, 1], [1, 2, 2, 1, 1, 1, 1, 2]]
stats8 = [110, 438, 143, -20, 154, -30]
