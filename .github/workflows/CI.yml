name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - version: 'nightly'
            os: macos-latest
          - version: 'nightly'
            os: windows-latest
    steps:
      # The fifteen packages are independent repositories that find each other
      # through [sources] path dependencies (`Networks = {path = "../Networks.jl"}`).
      # A lone checkout has no siblings, so those paths dangle and Pkg fails to
      # resolve before a single test runs. Rebuild the layout every developer has
      # locally: this package in a directory named after it, siblings beside it.
      - uses: actions/checkout@v4
        with:
          path: ERGMRank.jl

      # The clone list is DERIVED from Project.toml's [sources] (panel 2026-09,
      # item 29): every `path = "../<Pkg>.jl"` entry names a sibling, nothing
      # else is cloned, and a hand-typed list cannot drift from the manifest
      # again (this one used to clone SNA, which the package does not use).
      # POSIX sed, so the same line runs on the Linux, macOS and Windows cells.
      - name: Reconstruct the ecosystem layout
        shell: bash
        run: |
          org=https://github.com/statistical-network-analysis-with-Julia
          siblings=$(sed -n 's/.*path = "\(\.\.\/\)\{1,\}\([^"/]*\)\.jl".*/\2/p' ERGMRank.jl/Project.toml | sort -u)
          echo "siblings from [sources]: $siblings"
          for pkg in $siblings; do
            git clone --depth 1 --quiet "$org/$pkg.jl" "$pkg.jl"
          done

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      # Four threads on one cell: the parametric bootstrap refits its
      # replicates on all threads through `Networks.bootstrap_cov`, and the
      # standard errors must not depend on how many there are (all the
      # randomness lives in the simulation, seeded from the caller's rng).
      # Collect coverage on the single-threaded 1.12 Linux cell: instrumenting
      # the parallel MCMC/bridge loops can dominate their runtime (Julia #62424).
      - name: Run tests
        shell: bash
        working-directory: ERGMRank.jl
        env:
          JULIA_NUM_THREADS: ${{ (matrix.version == '1' && matrix.os == 'ubuntu-latest') && '4' || '1' }}
          OPENBLAS_NUM_THREADS: '1'
          JULIA_TEST_COVERAGE: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=ENV["JULIA_TEST_COVERAGE"] == "true")'

      # The allocation-regression gates (panel 2026-09, item 7): the
      # standalone benchmark environment must instantiate from the committed
      # metadata (`benchmark/Project.toml` [sources] point at `..` and the
      # siblings `../../Networks.jl`, `../../ERGM.jl` cloned above) and the
      # per-swap change-statistic and kernel-step pins must hold. `Pkg.test()`
      # guards the same pins ("swap_change and _swap_delta! allocate nothing",
      # "AlterSwap sampler runs on ERGM.mh_toggle!"); this step proves the
      # benchmark harness the site's tools/run_benchmarks.jl consumes runs.
      - name: Allocation regression gates (benchmark environment)
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ERGMRank.jl
        env:
          JULIA_NUM_THREADS: 4
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          directories: ERGMRank.jl/src

      - uses: codecov/codecov-action@v4
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
