name = "newcomb2_rank"

[provenance]
r_version = "4.6.1"
ergm_rank_version = "4.1.2"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/newcomb2_rank.R"
date = "2026-10-06"
dataset = "ergm.rank::newcomb[[2]] (Newcomb 1961): 17 fraternity men, week 2, each ranking the other 16, with week 1 (newcomb[[1]]) as the reference ranking; GREATER value = HIGHER standing"
model = "newcomb[[2]] ~ rank.deference + rank.nonconformity(\"localAND\") + rank.inconsistency(newcomb[[1]], \"rank\"), response=\"rank\", reference=~CompleteOrder"
r_estimator = "MCMC-MLE (AlterSwap proposal)"
julia_estimator = "MCMC-MLE (fit_ergm_rank, the default method=:mcmle, AlterSwap proposal) -- ASSERTED; the swap pseudo-likelihood (method=:mple) is a DIFFERENT estimator whose gap is characterised; see [tolerance]"
mcmc_control = "control.ergm(MCMC.samplesize=2048, MCMC.burnin=8192, MCMC.interval=512)"
replication_seeds = "101,202,303,404,505"

[tolerance]
# Observed sufficient statistics: deterministic, machine precision.
summary_statistics = 1e-9
#
# COEFFICIENTS: `fit_ergm_rank` (method=:mcmle) at ergm.rank's MCMC budget
# (n_samples=2048, burnin=8192, interval=512, one chain, bridge skipped) is
# asserted on one Julia seed as
#   |coef - mle_seed_mean| <= coefficient_sd_multiple * sqrt(1 + 1/5) * mle_seed_sd,
# where `mle_seed_sd`/`mle_seed_mean` ([values]) are ergm.rank over its five
# replication seeds. No number in this block is measured on ERGMRank.jl.
# Justification of the rule: if ERGMRank.jl's MCMLE is the same estimator as
# ergm.rank's, one Julia estimate is one more draw from ergm.rank's
# seed-to-seed distribution, so its difference from the mean of five
# independent R draws has sd sqrt(1 + 1/5) * sd_R, and 4 of that is a
# 4-sigma band. Do not raise the multiple: a failure at 4 means the
# estimators disagree.
coefficient_sd_multiple = 4
#
# STANDARD ERRORS: within `std_errors_rtol` relative of `mle_std_errors_mean`
# (the mean over ergm.rank's five replication seeds; its own seed-to-seed
# relative spread is listed in [values] as `mle_std_errors_rel_sd`). Both
# are the inverse Fisher information of a 2048-draw sample plus the
# Monte-Carlo component. 0.15 as in newcomb_rank.toml: several times the
# Monte-Carlo noise of ergm.rank's standard errors (the testset asserts
# 0.15 >= 4 * sqrt(2) * mle_std_errors_rel_sd) and far below the swap-MPLE's
# 2-3.3x anticonservatism, which must keep failing it.
std_errors_rtol = 0.15
#
# THE SWAP-MPLE HAS NO TOLERANCE, BY DESIGN: the testset asserts that every
# coefficient is MORE than `mple_gap_min_se` of an MLE standard error from
# `mle_seed_mean` (observed 0.89, 0.83, 0.76) and that its pseudo-Hessian
# standard errors are at least `mple_se_ratio_min` times narrower than
# `mle_std_errors_mean` (observed 3.3, 2.2, 2.0).
mple_gap_min_se = 0.5
mple_se_ratio_min = 1.9

[values]
