name = "rank_inconsistency_weights"

[provenance]
r_version = "4.6.1"
ergm_rank_version = "4.1.2"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260912
script = "test/fixtures/r/rank_inconsistency_weights.R"
date = "2026-10-02"
dataset = "the 4-actor ERGMRank.jl test network and the seeded 8-actor ranking of rank_terms.R, with their reference rankings; GREATER value = HIGHER standing"
model = "summary(nw ~ rank.inconsistency(ref, weights=, wtname=, wtcenter=), response=\"rank\") for a function and an array of weights, centred and not"
what = "summary statistics only: deterministic functions of the ranking, the reference and the weights"

[tolerance]
# Sums of frozen integer weights (minus, when centred, their mean): exact in
# Float64 up to the rounding of the mean. 1e-9 is machine precision with
# headroom; a disagreement is a bug in the weighted statistic.
default = 1e-9

[values]
# The weights function is (i, j, k) -> i + 2j - k. The arrays are stored
# flat in R's column-major order (first index fastest), as Julia's
# reshape(v, n, n, n) reads them.
# Statistic order: fun, fun centred, arr, arr centred, arr with NA in the
# repeated-index cells centred, arr without a wtname.
r_names = ["inconsistency.rank:fun", "inconsistency.rank:func", "inconsistency.rank:arr", "inconsistency.rank:arrc", "inconsistency.rank:arrnac", "inconsistency.rank"]

